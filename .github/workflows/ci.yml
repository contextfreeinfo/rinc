# Builds and tests on every push and pull request:
#   web      the web players (rinc.wasm, VM-only, and rinc-full.wasm, with the compiler), with zig: only
#            CI needs zig
#   desktop  rinc for Windows, macOS (universal) and Linux (x86-64 and arm64), with the web players
#            built in, so rinc -web and rinc -export work without anything else installed; tests run
#            every app headless
#   board    rinc.uf2 for the Fruit Jam, with the Pico SDK and Arm's toolchain
# A tag like v0.1.0 also publishes all of them as a GitHub release. Each night (if main changed since
# the last one), and whenever it's run by hand (Actions > ci > Run workflow), they go to the rolling
# "nightly" prerelease instead.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "37 8 * * *" # (daily; GitHub runs schedules on the default branch)
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_VERSION: 2.3.1
  ARM_TOOLCHAIN: 15.2.rel1
  ZIG_VERSION: 0.15.2

jobs:
  # whether to go on: a scheduled run skips everything when main hasn't changed since the last nightly
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
            [ "$last" = "$GITHUB_SHA" ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  web:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the web player
        run: python3 tools/web.py --wasm=rinc.wasm --wasm-full=rinc-full.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: rinc-wasm
          path: |
            rinc.wasm
            rinc-full.wasm

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            exe: build/Release/rinc.exe
          - os: macos-latest
            name: macos-universal
            exe: build/rinc
            flags: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - os: ubuntu-22.04 # (an older glibc: the binary runs on more Linux systems)
            name: linux-x86_64
            exe: build/rinc
          - os: ubuntu-22.04-arm # (64-bit Arm: Raspberry Pi OS on a Pi 4 or 5, say)
            name: linux-arm64
            exe: build/rinc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: rinc-wasm
      - name: Install SDL's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev \
            libdecor-0-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRINC_PLATFORM=desktop -DRINC_WEB_WASM=rinc.wasm -DRINC_WEB_WASM_FULL=rinc-full.wasm ${{ matrix.flags }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          # just the one program (rinc -help and rinc -license say the rest): rinc.exe zipped, or rinc in
          # a gzipped tar (which keeps it executable)
          version=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo nightly)
          name="rinc-$version-${{ matrix.name }}"
          mkdir dist
          if [ "${{ runner.os }}" = Windows ]; then 7z a "dist/$name.zip" ./${{ matrix.exe }} > /dev/null
          else tar czf "dist/$name.tar.gz" -C build rinc; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rinc-${{ matrix.name }}
          path: dist/*

  board:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache the toolchain and SDK
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/pico
          key: pico-${{ env.PICO_SDK_VERSION }}-arm-${{ env.ARM_TOOLCHAIN }}
      - name: Get Arm's toolchain and the Pico SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/pico && cd ~/pico
          curl -sSfL https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_TOOLCHAIN/binrel/arm-gnu-toolchain-$ARM_TOOLCHAIN-x86_64-arm-none-eabi.tar.xz | tar xJ
          mv arm-gnu-toolchain-* arm
          git clone -q --depth 1 --branch $PICO_SDK_VERSION https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update -q --init --depth 1 lib/tinyusb
      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          export PATH=~/pico/arm/bin:$PATH
          cmake -S . -B build -G Ninja -DPICO_SDK_PATH=$HOME/pico/pico-sdk
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: rinc.uf2
          path: build/rinc.uf2

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [web, desktop, board]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Replace the nightly
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Nightly" \
            --notes "Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). Replaced each night main changes, and when the ci workflow is run by hand."
