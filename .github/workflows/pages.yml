# The apps as web pages, on GitHub Pages (rincpc.com): each push to main builds the web player and a
# headless rinc, makes a page of each app (rinc -web), and an index linking them, from each app's first
# comment line, and the docs (mdbook, from docs/) under /docs.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build the web player and a headless rinc
        run: |
          python3 tools/web.py --wasm=rinc.wasm
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRINC_PLATFORM=desktop -DRINC_SDL=OFF -DRINC_WEB_WASM=rinc.wasm
          cmake --build build --parallel
      - name: Make the pages
        run: |
          mkdir -p site
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1"><title>Rinc apps</title>'
            echo '<style>body{margin:0;padding:24px 16px;background:#1d2b53;color:#fff1e8;font:16px/1.5 ui-monospace,monospace}'
            echo 'main{max-width:720px;margin:auto}a{color:#ffec27}h1{font-size:22px}li{margin:10px 0}p{color:#c2c3c7}</style>'
            echo '</head><body><main><h1>Rinc apps</h1>'
            echo '<p>Rinc apps, playing in the browser: the same Rio VM as on the board and the desktop. Arrows and V C X Z, or a controller. <a href="docs/">Docs</a>: making apps, and what a Rinc provides.</p><ul>'
            for app in apps/*.rio; do
              name=$(basename "$app" .rio)
              case $name in bench|micro) continue;; esac # (timings, not demos)
              build/rinc "$app" -web "site/$name.html"
              about=$(head -1 "$app" | sed -e 's/^# *//' -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
              echo "<li><a href=\"$name.html\">$name</a>: $about</li>"
            done
            echo '</ul><p><a href="docs/">Docs</a> &middot; <a href="https://github.com/rincpc/rinc">Source</a></p></main></body></html>'
          } > site/index.html
          ls -l site
      - name: Make the docs
        run: |
          v=0.4.40
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v$v/mdbook-v$v-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          ./mdbook build docs --dest-dir ../site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
