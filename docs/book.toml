# The docs as a web site: mdbook build docs (into docs/book). SUMMARY.md sets the order. The pages
# workflow puts it at rincpc.com/docs, next to the demo apps.
[book]
title = "Rinc"
src = "."
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/rincpc/rinc"
