<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; aspect-ratio: 4 / 3; width: min(100vw, 133.33vh); }
#err { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px; color: #ff77a8; font: 13px monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas width="320" height="240"></canvas>
<pre id="err" hidden></pre>
<script>
(async () => {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const canvas = document.querySelector("canvas"), ctx = canvas.getContext("2d"), image = ctx.createImageData(320, 240);
  const err = document.getElementById("err"), t0 = performance.now(), cart = b64("{{CART}}");
  let ex, out = "";
  const text = (p, n) => new TextDecoder().decode(new Uint8Array(ex.memory.buffer, p, n));
  const fail = p => { const m = new Uint8Array(ex.memory.buffer, p); err.textContent = text(p, m.indexOf(0)); err.hidden = false; };
  const env = {
    put: (p, n) => { out += text(p, n); const lines = out.split("\n"); out = lines.pop(); lines.forEach(l => console.log(l)); },
    now: () => (performance.now() - t0) / 1000,
  };
  ex = (await WebAssembly.instantiate(b64("{{WASM}}"), { env })).instance.exports;
  ex._initialize();
  new Uint8Array(ex.memory.buffer, ex.source(), cart.length).set(cart);
  const draw = () => { image.data.set(new Uint8Array(ex.memory.buffer, ex.pixels(), 320 * 240 * 4)); ctx.putImageData(image, 0, 0); };
  if (ex.start(cart.length)) { draw(); fail(ex.error()); return; }
  // sound: an AudioWorklet plays what the wasm mixes, kept about 60 ms ahead of the audio clock.
  // Browsers start sound only after a key or a click; until then a frame's sound is mixed and dropped
  const worklet = `class Rinc extends AudioWorkletProcessor {
    constructor() { super(); this.q = []; this.at = 0; this.port.onmessage = e => this.q.push(e.data); }
    process(inputs, outputs) {
      const l = outputs[0][0], r = outputs[0][1]; let i = 0;
      while (i < l.length) {
        const b = this.q[0];
        if (!b) { l.fill(0, i); r.fill(0, i); break; }
        for (; i < l.length && this.at < b.length; i++, this.at += 2) { l[i] = b[this.at]; r[i] = b[this.at + 1]; }
        if (this.at >= b.length) { this.q.shift(); this.at = 0; }
      }
      return true;
    }
  }
  registerProcessor("rinc", Rinc);`;
  let audio = null, node = null, sent = 0;
  const mixed = n => { const s = new Int16Array(ex.memory.buffer, ex.mix(n), n * 2), f = new Float32Array(n * 2); for (let i = 0; i < f.length; i++) f[i] = s[i] / 32768; return f; };
  const startAudio = async () => {
    if (audio) return;
    audio = new AudioContext({ sampleRate: 48000 });
    await audio.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: "text/javascript" })));
    node = new AudioWorkletNode(audio, "rinc", { outputChannelCount: [2] });
    node.connect(audio.destination);
    sent = Math.floor(audio.currentTime * 48000);
  };
  const feed = () => {
    if (!node) { mixed(800); return; }
    for (const want = Math.floor((audio.currentTime + 0.06) * 48000); sent < want;) {
      const n = Math.min(2048, want - sent);
      node.port.postMessage(mixed(n)); sent += n;
    }
  };
  addEventListener("keydown", startAudio); addEventListener("pointerdown", startAudio);
  // btn: arrows, then A (V), B (C), X (X), Y (Z)
  const keys = { ArrowLeft: 1, ArrowRight: 2, ArrowUp: 4, ArrowDown: 8, KeyV: 16, KeyC: 32, KeyX: 64, KeyZ: 128 };
  let buttons = 0, next = performance.now(), game = true;
  // a controller, in the browser's standard layout (Xbox's): its buttons as Rinc's, sticks and triggers
  const padBits = [16, 32, 64, 128, 256, 512, 0, 0, 8192, 4096, 1024, 2048, 4, 8, 1, 2];
  const gamepad = () => {
    const p = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(g => g && g.mapping === "standard");
    if (!p) { ex.axes(0, 0, 0, 0, 0, 0); return 0; }
    let b = 0;
    p.buttons.forEach((x, i) => { if (x.pressed && padBits[i]) b |= padBits[i]; });
    const s = v => Math.round(Math.max(-1, Math.min(1, v || 0)) * 32767);
    ex.axes(s(p.axes[0]), s(p.axes[1]), s(p.axes[2]), s(p.axes[3]), s(p.buttons[6] && p.buttons[6].value), s(p.buttons[7] && p.buttons[7].value));
    return b;
  };
  addEventListener("keydown", e => {
    if (keys[e.code]) { buttons |= keys[e.code]; e.preventDefault(); }
    const c = e.key.length === 1 ? e.key.charCodeAt(0) : e.key === "Enter" ? 13 : e.key === "Backspace" ? 8 : 0; // key(): typing
    if (c && c < 127 && !e.ctrlKey && !e.metaKey) { ex.typed(c); if (c === 8) e.preventDefault(); }
  });
  addEventListener("keyup", e => { if (keys[e.code]) buttons &= ~keys[e.code]; });
  addEventListener("blur", () => { buttons = 0; });
  const tick = now => {
    while (game && now >= next) { // 60 frames a second, whatever the display's rate
      const r = ex.frame(buttons | gamepad());
      if (r) { game = false; if (r < 0) fail(ex.error()); }
      if (!node) mixed(800); // (no sound yet: keep time anyway)
      next += 1000 / 60;
      if (now - next > 100) next = now;
    }
    if (node) feed();
    draw();
    if (game) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
